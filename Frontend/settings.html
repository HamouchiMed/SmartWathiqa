<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paramètres - SmartWathiqa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="settings.css">
</head>
<body class="bg-white">
    <!-- Drawer Menu -->
    <div id="drawer" class="fixed left-0 top-0 h-screen z-40 w-72 overflow-y-auto lg:translate-x-0 transform -translate-x-full transition-transform duration-300 ease-in-out" style="background: rgb(0, 94, 184);">
        <!-- Header -->
        <div class="p-6 border-b" style="border-color: #5B9FD9; background: rgb(0, 94, 184)">
            <h2 class="text-lg font-bold" style="color: #ffffff;">SmartWathiqa</h2>
        </div>

        <!-- User Profile Section -->
        <div class="p-6" style="border-bottom: 1px solid #5B9FD9;">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-12 h-12 rounded-full flex items-center justify-center" style="background: #ffffff; color: #005EB8;">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                </div>
                <div>
                    <p class="text-white font-semibold text-sm">Mon Compte</p>
                    <p class="text-blue-100 text-xs">utilisateur@example.com</p>
                </div>
            </div>
        </div>

        <!-- Main Navigation -->
        <nav class="p-4" style="border-bottom: 1px solid #5B9FD9;">
            <p class="text-blue-100 text-xs font-semibold mb-3 px-2 uppercase">Navigation</p>
            <a href="dashboardemployer.html" class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors" style="color: #ffffff;" onmouseover="this.style.background='rgb(0, 94, 184)'" onmouseout="this.style.background='transparent'">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-3m0 0l7-4 7 4M5 9v10a1 1 0 001 1h12a1 1 0 001-1V9m-9 11l4-4m0 0l-4-4m4 4l4 4m0-4l-4-4"></path>
                </svg>
                <span>Tableau de bord</span>
            </a>
            <a href="documents.html" class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors" style="color: #ffffff;" onmouseover="this.style.background='rgb(0, 94, 184)'" onmouseout="this.style.background='transparent'">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2H5a2 2 0 00-2 2z"></path>
                </svg>
                <span>Mes documents</span>
            </a>
            <a href="documents.html#favoris" class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors" style="color: #ffffff;" onmouseover="this.style.background='rgb(0, 94, 184)'" onmouseout="this.style.background='transparent'">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.539 1.118l-2.8-2.034a1 1 0 00-1.176 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81H7.03a1 1 0 00.95-.69l1.07-3.292z"></path>
                </svg>
                <span>Favoris</span>
            </a>
        </nav>

        <!-- Footer -->
        <div class="p-4" style="border-top: 1px solid #5B9FD9;">
            <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors" style="color: #ffffff; background: rgba(0, 94, 184, 0.5);" onmouseover="this.style.background='rgb(0, 94, 184)'" onmouseout="this.style.background='rgba(0, 94, 184, 0.5)'">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
                <span>Paramètres</span>
            </a>
            <button onclick="logout()" class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors w-full text-left mt-2" style="color: #ffffff;" onmouseover="this.style.background='rgba(239, 68, 68, 0.2)'" onmouseout="this.style.background='transparent'">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                </svg>
                <span>Déconnexion</span>
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <main class="lg:ml-72 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="max-w-4xl mx-auto space-y-8">

            <!-- Profile Settings -->
            <div class="bg-white rounded-2xl border border-gray-200 p-8">
                <div class="flex items-center gap-4 mb-6">
                    <div class="w-12 h-12 rounded-xl bg-blue-600 flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                    </div>
                    <div>
                        <h2 class="text-xl font-bold text-gray-900">Profil utilisateur</h2>
                        <p class="text-gray-600">Gérez vos informations personnelles</p>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Nom complet</label>
                        <input type="text" value="Utilisateur" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                        <input type="email" value="utilisateur@example.com" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Téléphone</label>
                        <input type="tel" placeholder="+33 6 XX XX XX XX" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                </div>

            </div>

            <!-- Storage Settings -->
            <div class="bg-white rounded-2xl border border-gray-200 p-8">
                <div class="flex items-center gap-4 mb-6">
                    <div class="w-12 h-12 rounded-xl bg-orange-600 flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 19a2 2 0 01-2-2V7a2 2 0 012-2h4l2 2h4a2 2 0 012 2v1M5 19h14a2 2 0 002-2v-5a2 2 0 00-2-2H9a2 2 0 00-2 2v5a2 2 0 01-2 2z"></path>
                        </svg>
                    </div>
                    <div>
                        <h2 class="text-xl font-bold text-gray-900">Stockage</h2>
                        <p class="text-gray-600">Gérez votre espace de stockage</p>
                    </div>
                </div>

                <div class="space-y-4">
                    <div>
                        <div class="flex justify-between text-sm text-gray-600 mb-2">
                            <span>Espace utilisé</span>
                            <span id="storage-used-text">0 GB sur 10 GB</span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-3">
                            <div id="storage-used-bar" class="bg-blue-600 h-3 rounded-full" style="width: 0%"></div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 pt-4">
                        <div class="text-center p-4 bg-gray-50 rounded-xl">
                            <div id="storage-documents" class="text-2xl font-bold text-blue-600">0 GB</div>
                            <div class="text-sm text-gray-600">Documents</div>
                        </div>
                        <div class="text-center p-4 bg-gray-50 rounded-xl">
                            <div id="storage-images" class="text-2xl font-bold text-green-600">0 GB</div>
                            <div class="text-sm text-gray-600">Images</div>
                        </div>
                        <div class="text-center p-4 bg-gray-50 rounded-xl">
                            <div id="storage-others" class="text-2xl font-bold text-purple-600">0 GB</div>
                            <div class="text-sm text-gray-600">Autres</div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Scripts -->
    <script src="api-client.js"></script>
    <script src="settings.js"></script>
</body>
</html>
